[project]
name = "jobfit-agent"
version = "0.1.0"
description = "A FastAPI RAG agent for resume and job description matching."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.2",
    "python-docx==1.1.2",
    "python-multipart==0.0.20",
    "pypdf==5.0.1",
    "sentence-transformers>=2.2.0",
    "uvicorn==0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
