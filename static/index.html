<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobFit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 17.5 14 22l9-12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --panel: #ffffff;
        --text: #162021;
        --muted: #647172;
        --line: #dce5e3;
        --accent: #0f766e;
        --accent-dark: #0b5f58;
        --accent-soft: #e8f5f3;
        --ink: #243735;
        --blue: #245a8d;
        --blue-soft: #eaf3fb;
        --gold: #8b6a15;
        --gold-soft: #fbf4dc;
        --warn: #a15c07;
        --warn-soft: #fff5df;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --soft: #f3f7f6;
        --shadow: 0 14px 34px rgba(22, 32, 33, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .wrap {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
      }

      header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 66px;
        gap: 16px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 23px;
        line-height: 1.2;
      }

      h2 {
        font-size: 18px;
        line-height: 1.3;
      }

      h3 {
        font-size: 15px;
        line-height: 1.35;
      }

      p,
      li {
        line-height: 1.55;
      }

      main {
        padding: 22px 0 42px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .input-panel {
        padding: 18px;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.06), transparent 42%),
          var(--panel);
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .panel-copy {
        display: grid;
        gap: 7px;
        max-width: 720px;
      }

      .panel-copy h2 {
        font-size: 24px;
      }

      .workflow-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .workflow-step {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 64px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
      }

      .step-index {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 800;
      }

      .workflow-step strong,
      .workflow-step span {
        display: block;
      }

      .workflow-step span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 13px;
      }

      .input-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        background: #fcfefd;
        color: var(--text);
        font: inherit;
      }

      textarea {
        min-height: 280px;
        resize: vertical;
        line-height: 1.55;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
      }

      .form-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: end;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .upload-box {
        display: grid;
        gap: 8px;
      }

      button {
        min-width: 168px;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .button-secondary {
        min-width: 120px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #fcfefd;
      }

      .button-secondary:hover {
        background: var(--soft);
      }

      .button-ghost {
        min-width: auto;
        border: 1px solid transparent;
        color: var(--accent);
        background: transparent;
        padding: 8px 10px;
      }

      .button-ghost:hover {
        border-color: var(--line);
        background: var(--accent-soft);
      }

      .report {
        margin-top: 20px;
      }

      .empty {
        padding: 20px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .report-shell {
        display: grid;
        gap: 16px;
      }

      .summary-band {
        display: grid;
        grid-template-columns: minmax(180px, 0.65fr) minmax(0, 2.35fr);
        gap: 16px;
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .score-box {
        display: grid;
        align-content: center;
        min-height: 150px;
        padding: 16px;
        border-radius: 8px;
        background: var(--accent-soft);
        border: 1px solid #c9e8e3;
      }

      .score-box span {
        color: var(--muted);
        font-weight: 750;
      }

      .score {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 8px;
      }

      .score strong {
        font-size: 52px;
        line-height: 1;
      }

      .summary-copy {
        display: grid;
        gap: 14px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .metric span {
        display: block;
        min-height: 34px;
        color: var(--muted);
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }

      .section-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .section-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .section-card.wide {
        grid-column: 1 / -1;
      }

      .agent-card {
        grid-column: 1 / -1;
        display: grid;
        gap: 14px;
        padding: 0;
        overflow: hidden;
        border-color: #c9e8e3;
      }

      .agent-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(240px, 0.55fr);
        gap: 16px;
        align-items: center;
        padding: 16px;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(36, 90, 141, 0.08)),
          #fcfefd;
        border-bottom: 1px solid var(--line);
      }

      .agent-title {
        display: grid;
        gap: 7px;
      }

      .agent-title h3 {
        font-size: 17px;
      }

      .agent-status {
        justify-self: end;
        display: grid;
        gap: 8px;
        min-width: 220px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
      }

      .status-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }

      .agent-body {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .agent-layout {
        display: grid;
        grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.35fr);
        gap: 14px;
      }

      .agent-column {
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .agent-subpanel {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fcfefd;
      }

      .agent-subpanel h4 {
        margin: 0;
        font-size: 14px;
      }

      .agent-kpis {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .agent-kpi {
        min-height: 66px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .agent-kpi span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .agent-kpi strong {
        display: block;
        margin-top: 6px;
        font-size: 20px;
      }

      .question-card,
      .proposal-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .question-card {
        border-left: 4px solid var(--gold);
      }

      .proposal-card {
        border-left: 4px solid var(--accent);
      }

      .proposal-card.accepted {
        border-left-color: var(--blue);
        background: var(--blue-soft);
      }

      .question-head,
      .proposal-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-height: 24px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .chip.strong {
        border-color: #b8dfd8;
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .chip.warn {
        border-color: #efd28f;
        background: var(--gold-soft);
        color: var(--gold);
      }

      .chip.danger {
        border-color: #f6c5c0;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .proposal-copy {
        display: grid;
        gap: 8px;
      }

      .copy-block {
        display: grid;
        gap: 5px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
      }

      .copy-block strong {
        color: var(--muted);
        font-size: 12px;
      }

      .agent-actions,
      .proposal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .question-answer {
        min-height: 92px;
      }

      .message-list {
        display: grid;
        gap: 8px;
        max-height: 250px;
        overflow: auto;
      }

      .message {
        padding: 9px 10px;
        border-radius: 7px;
        background: var(--soft);
        font-size: 13px;
      }

      .message.user {
        background: var(--accent-soft);
      }

      .section-card h3 {
        margin-bottom: 10px;
      }

      .pill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        max-width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fcfefd;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
      }

      .pill.warn {
        border-color: #f0d098;
        background: var(--warn-soft);
        color: var(--warn);
      }

      .pill.danger {
        border-color: #f6c5c0;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .detail-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .detail-item {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fcfefd;
        word-break: break-word;
      }

      .detail-title {
        display: block;
        margin-bottom: 5px;
        font-weight: 700;
      }

      .detail-meta {
        color: var(--muted);
        font-size: 13px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        background: #fcfefd;
      }

      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 14px;
        line-height: 1.45;
      }

      th {
        color: var(--muted);
        background: var(--soft);
        font-weight: 750;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      summary {
        cursor: pointer;
        padding: 14px 16px;
        font-weight: 750;
      }

      .analysis-drawer {
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .analysis-drawer > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        list-style: none;
        background: #fcfefd;
      }

      .analysis-drawer > summary::-webkit-details-marker {
        display: none;
      }

      .analysis-summary-copy {
        display: grid;
        gap: 3px;
      }

      .analysis-summary-copy strong {
        font-size: 16px;
      }

      .analysis-content {
        display: grid;
        gap: 16px;
        padding: 0 16px 16px;
        border-top: 1px solid var(--line);
      }

      .analysis-content .summary-band {
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding-right: 0;
        padding-left: 0;
      }

      .evidence {
        max-height: 320px;
        overflow: auto;
        display: grid;
        gap: 8px;
        padding: 0 16px 16px;
      }

      .quote {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px;
        background: #fcfefd;
      }

      .tag {
        display: inline-block;
        margin-bottom: 6px;
        color: var(--warn);
        font-size: 12px;
        font-weight: 750;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.5;
      }

      /* Agent-first application shell */
      body {
        background:
          radial-gradient(circle at 8% 4%, rgba(15, 118, 110, 0.08), transparent 28%),
          #eef3f1;
      }

      header {
        position: relative;
        background: rgba(248, 251, 250, 0.92);
      }

      .wrap {
        width: min(1440px, calc(100vw - 40px));
      }

      header .wrap {
        min-height: 62px;
      }

      .brand {
        flex-direction: row;
        align-items: center;
        gap: 11px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-size: 17px;
        font-weight: 850;
        box-shadow: 0 8px 20px rgba(15, 118, 110, 0.2);
      }

      .brand-copy {
        display: grid;
        gap: 1px;
      }

      .brand-copy span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .header-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .header-status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #29a98b;
        box-shadow: 0 0 0 4px rgba(41, 169, 139, 0.12);
      }

      main {
        padding: 20px 0 36px;
      }

      .intake-shell {
        display: grid;
        grid-template-columns: minmax(330px, 0.72fr) minmax(0, 1.28fr);
        min-height: calc(100vh - 118px);
        overflow: hidden;
        border: 1px solid rgba(15, 91, 84, 0.16);
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(26, 58, 53, 0.1);
      }

      .intake-story {
        display: flex;
        flex-direction: column;
        padding: clamp(30px, 4vw, 56px);
        color: #ffffff;
        background:
          radial-gradient(circle at 20% 12%, rgba(107, 224, 202, 0.2), transparent 30%),
          linear-gradient(155deg, #0d5d56 0%, #123f3b 58%, #102f2d 100%);
      }

      .intake-story .eyebrow {
        color: #91e5d5;
      }

      .intake-story h2 {
        max-width: 560px;
        margin-top: 14px;
        font-size: clamp(30px, 3.4vw, 48px);
        line-height: 1.12;
        letter-spacing: -0.035em;
      }

      .intake-lead {
        max-width: 540px;
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 15px;
      }

      .story-steps {
        display: grid;
        gap: 8px;
        margin-top: clamp(30px, 6vh, 64px);
      }

      .story-step {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 13px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .story-step:last-child {
        border-bottom: 0;
      }

      .story-step-index {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(145, 229, 213, 0.36);
        border-radius: 12px;
        background: rgba(145, 229, 213, 0.1);
        color: #a9eee1;
        font-size: 13px;
        font-weight: 800;
      }

      .story-step strong,
      .story-step span {
        display: block;
      }

      .story-step strong {
        font-size: 14px;
      }

      .story-step span {
        margin-top: 3px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 12px;
      }

      .story-policy {
        margin-top: auto;
        padding-top: 28px;
        color: rgba(255, 255, 255, 0.56);
        font-size: 12px;
        line-height: 1.65;
      }

      .intake-form-card {
        display: grid;
        align-content: center;
        padding: clamp(26px, 4vw, 54px);
        background:
          linear-gradient(180deg, rgba(239, 247, 245, 0.68), transparent 28%),
          #ffffff;
      }

      .intake-form-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }

      .intake-form-head > div {
        display: grid;
        gap: 6px;
      }

      .intake-form-head h2 {
        font-size: 24px;
      }

      .material-count {
        flex: 0 0 auto;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .intake-form-card .input-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .field-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .intake-form-card textarea {
        min-height: 154px;
        border-radius: 10px;
        background: #fbfdfc;
      }

      .intake-form-card #jd {
        min-height: 172px;
      }

      .intake-form-card .form-actions {
        grid-template-columns: minmax(0, 1fr) auto;
        margin-top: 16px;
      }

      .intake-form-card button {
        min-width: 210px;
        border-radius: 10px;
        padding: 14px 20px;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.18);
      }

      .form-notice {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 9px;
        background: var(--accent-soft);
        color: var(--accent-dark);
        font-size: 13px;
      }

            <div class="story-step">
              <span class="story-step-index">03</span>
              <strong>匹配结果</strong>
            </div>
          </div>
        </aside>
        <div class="intake-form-card">
          <div class="intake-form-head">
            <div>
              <h2>新建分析</h2>
            </div>
          </div>

          <form id="form">
            <div class="input-grid">
              <div class="field">
                <div class="field-head">
                  <label for="resume-text">简历内容</label>
                </div>
                <textarea
                  id="resume-text"
                  name="resume_text"
                  placeholder="粘贴简历内容"
                ></textarea>
              </div>
              <div class="field">
                <div class="field-head">
                  <label for="jd">岗位描述</label>
                  <span>至少 20 个字符</span>
                </div>
                <textarea
                  id="jd"
                  name="jd"
                  required
                  minlength="20"
                  placeholder="粘贴岗位描述"
                ></textarea>
              </div>
            </div>
            <div class="form-actions">
              <div class="upload-box">
                <label for="resume">简历文件</label>
                <input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt,.md" />
                <span class="muted small">PDF、DOCX、TXT、Markdown</span>
              </div>
              <button id="submit" type="submit">开始分析</button>
            </div>
            <div id="intake-notice" class="form-notice" aria-live="polite"></div>
          </form>
        </div>
      </section>

      <section class="report" aria-live="polite">
        <div id="result"></div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#form");
      const button = document.querySelector("#submit");
      const result = document.querySelector("#result");
      const intakeShell = document.querySelector("#intake-shell");
      const intakeNotice = document.querySelector("#intake-notice");
      const resumeText = document.querySelector("#resume-text");
      const resumeFile = document.querySelector("#resume");
      const jdText = document.querySelector("#jd");
      let latestAnalysis = null;
      let resumeAgentSession = null;
      const activeSessionKey = "jobfit.active-session";

      function rememberSession(id) {
        const url = new URL(window.location.href);
        if (id) url.searchParams.set("session", id);
        else url.searchParams.delete("session");
        window.history.replaceState(null, "", url);
        try {
          if (id) sessionStorage.setItem(activeSessionKey, id);
          else sessionStorage.removeItem(activeSessionKey);
        } catch (_) { /* The URL can restore a session when storage is unavailable. */ }
      }

      async function restoreSession() {
        const url = new URL(window.location.href);
        let id = url.searchParams.get("session");
        if (!url.searchParams.has("session")) {
          try { id = sessionStorage.getItem(activeSessionKey); } catch (_) {}
        }
        if (!id) return;
        if (!/^ras_[a-f0-9]{12}$/.test(id)) {
          rememberSession(null);
          showIntakeNotice("会话链接无效，请重新开始分析。", "danger");
          return;
        }
        button.disabled = true;
        showIntakeNotice("正在恢复会话...");
        try {
          const response = await fetch(`/resume-agent/sessions/${encodeURIComponent(id)}`);
          const payload = await response.json();
          if (!response.ok) {
            if (response.status === 404) rememberSession(null);
            throw new Error(response.status === 404 ? "会话已不存在，请重新提供材料。" : apiErrorMessage(payload, "会话恢复失败，请刷新重试。"));
          }
          resumeAgentSession = payload;
          latestAnalysis = payload.analysis;
          resumeText.value = payload.resume_text;
          jdText.value = payload.jd_text;
          document.body.classList.add("session-active");
          rememberSession(payload.id);
          showIntakeNotice("");
          renderWorkspace();
        } catch (error) {
          showIntakeNotice(error.message, "danger");
        } finally {
          button.disabled = false;
        }
      }

      function apiErrorMessage(payload, fallback) {
        const detail = payload?.detail;
        if (typeof detail === "string" && detail.trim()) return detail;
        if (Array.isArray(detail)) {
          const messages = detail
            .map((item) => item?.msg || item?.message || (typeof item === "string" ? item : ""))
            .filter(Boolean);
          if (messages.length) return messages.join("；");
        }
        if (detail && typeof detail === "object") {
          return detail.message || detail.msg || fallback;
        }
        return payload?.message || fallback;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showIntakeNotice("");

        if (!resumeText.value.trim() && !resumeFile.files[0]) {
          showIntakeNotice("请粘贴简历文本，或者上传一个简历文件。", "danger");
          return;
        }

        const data = new FormData();
        if (resumeText.value.trim()) {
          data.append("resume_text", resumeText.value);
        }
        if (resumeFile.files[0]) {
          data.append("resume", resumeFile.files[0]);
        }
        data.append("jd_text", jdText.value);

        button.disabled = true;
        button.textContent = "分析中...";
        showIntakeNotice("正在分析材料...");

        try {
          const response = await fetch("/resume-agent/sessions/from-document", { method: "POST", body: data });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(apiErrorMessage(payload, "分析启动失败"));
          }
          resumeAgentSession = payload;
          latestAnalysis = payload.analysis;
          rememberSession(payload.id);
          document.body.classList.add("session-active");
          showIntakeNotice("");
          renderWorkspace();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          showIntakeNotice(error.message, "danger");
        } finally {
          button.disabled = false;
          button.textContent = "开始分析";
        }
      });

      result.addEventListener("click", async (event) => {
        const action = event.target.closest("[data-agent-action]")?.dataset.agentAction;
        if (!action) return;

        if (action === "answer") {
          await submitAgentAnswers(event.target);
        }
        if (action === "accept" || action === "reject") {
          await submitProposalDecision(event.target, action);
        }
        if (action === "correct-fact") {
          await submitFactCorrection(event.target);
        }
        if (action === "analysis") {
          const drawer = document.querySelector(".analysis-drawer");
          if (drawer) {
            drawer.open = true;
            drawer.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }
        if (action === "new-session") {
          resetWorkspace();
        }
        if (action === "document-view" || action === "interview-view") {
          document.querySelector(action === "document-view" ? "#document-panel" : "#interview-panel")?.scrollIntoView({behavior: "smooth", block: "start"});
        }
        if (["document-preview", "document-apply", "document-edit", "document-restore", "document-export"].includes(action)) {
          await documentAction(event.target.closest("[data-agent-action]"), action);
        }
        if (["interview-start", "interview-answer", "interview-skip", "interview-pause", "interview-resume", "interview-finish"].includes(action)) {
          await interviewAction(event.target.closest("[data-agent-action]"), action);
        }
      });

      function showIntakeNotice(message, tone = "info") {
        intakeNotice.textContent = message;
        intakeNotice.className = `form-notice${message ? " show" : ""}${tone === "danger" ? " danger" : ""}`;
      }

      function resetWorkspace() {
        rememberSession(null);
        resumeAgentSession = null;
        latestAnalysis = null;
        result.className = "";
        result.innerHTML = "";
        document.body.classList.remove("session-active");
        showIntakeNotice("");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderWorkspace() {
        if (!resumeAgentSession || !latestAnalysis) return;
        result.className = "report-shell";
        result.innerHTML = `
          ${agentSection()}
          ${documentPanel(resumeAgentSession)}
          ${interviewPanel(resumeAgentSession)}
          ${analysisDrawer(latestAnalysis)}
        `;
      }

      function analysisDrawer(data) {
        const breakdown = data.score_breakdown || {};
        const initialScore = resumeAgentSession?.initial_analysis?.match_score;
        const updated = Boolean(resumeAgentSession?.facts?.length);
        return `
          <details class="analysis-drawer">
            <summary>
              <span class="analysis-summary-copy">
                <strong>${updated ? "补充后" : "初步"}匹配详情 · ${data.match_score || 0}/100</strong>
              </span>
              <span class="chip">展开</span>
            </summary>
            <div class="analysis-content">
              <div class="summary-band">
                <div class="score-box">
                  <span>匹配度</span>
                  <div class="score"><strong>${data.match_score}</strong><span class="muted">/ 100</span></div>
                </div>
                <div class="summary-copy">
                  <div>
                    <h2>${updated ? "补充后分析" : "初步分析"}</h2>
                    ${updated && initialScore != null ? `<p class="muted small">初始匹配度 ${initialScore}/100 → 当前 ${data.match_score}/100</p>` : ""}
                    <p class="muted">${escapeHtml(data.summary)}</p>
                  </div>
                  <div class="metrics">
                    ${metric("技能匹配", `${breakdown.skill_score || 0}`)}
                    ${metric("经验匹配", `${breakdown.experience_score || 0}`)}
                    ${metric("项目匹配", `${breakdown.project_score || 0}`)}
                    ${metric("学历匹配", `${breakdown.education_score || 0}`)}
                  </div>
                  ${data.fallback_used ? '<span class="pill warn">已使用本地规则</span>' : ""}
                </div>
              </div>

              <div class="section-grid">
                ${pillSection("待补强", data.risk_items || [], "warn")}
                ${matchDetailSection(data.matched_strengths || [])}
                ${listSection("补强项", (data.gaps || []).map((x) => ({ title: x.requirement, body: x.suggestion, meta: "" })))}
                ${listSection("改写参考", (data.resume_rewrites || []).map((x) => ({ title: x.after, body: x.reason, meta: x.before })), true)}
                ${listSection("面试问题", (data.interview_questions || []).map((x) => ({ title: x.question, body: x.focus, meta: x.difficulty })))}
              </div>
            </div>
          </details>
        `;
      }

      async function submitAgentAnswers(trigger) {
        if (!resumeAgentSession) return;

        const answers = resumeAgentSession.pending_questions
          .map((question) => {
            const textarea = document.querySelector(`[data-question-id="${cssEscape(question.id)}"]`);
            return {
              question_id: question.id,
              requirement: question.requirement,
              requirement_id: question.requirement_id,
              answer: textarea?.value.trim() || "",
              answer_type: document.querySelector(`[data-answer-type="${cssEscape(question.id)}"]`)?.value || "details",
            };
          })
          .filter((item) => item.answer || item.answer_type !== "details");

        if (!answers.length) {
          showAgentNotice("请先填写至少一项。", "warn");
          return;
        }

        await withBusy(trigger, "更新中...", async () => {
          const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/messages`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: "用户补充了简历事实。", answers }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(apiErrorMessage(payload, "更新失败"));
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      async function submitProposalDecision(trigger, action) {
        if (!resumeAgentSession) return;
        const proposalId = trigger.closest("[data-proposal-id]")?.dataset.proposalId;
        if (!proposalId) return;

        await withBusy(trigger, action === "accept" ? "采纳中..." : "记录中...", async () => {
          const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/decisions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              proposal_id: proposalId,
              version: Number(trigger.closest("[data-proposal-id]")?.dataset.proposalVersion || 1),
              decision: action === "accept" ? "accepted" : "rejected",
              note: action === "accept" ? "采纳该候选建议。" : "暂不采纳该候选建议。",
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(apiErrorMessage(payload, "记录选择失败"));
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      async function withBusy(buttonEl, label, work) {
        const original = buttonEl.textContent;
        buttonEl.disabled = true;
        buttonEl.textContent = label;
        try {
          await work();
        } catch (error) {
          const action = buttonEl.dataset?.agentAction || "";
          const notice = document.querySelector(action.startsWith("document-") ? "#document-notice" : action.startsWith("interview-") ? "#interview-notice" : "#agent-notice");
          if (notice) {
            notice.className = "workspace-notice show danger";
            notice.textContent = error.message;
          } else showAgentNotice(error.message, "danger");
        } finally {
          buttonEl.disabled = false;
          buttonEl.textContent = original;
        }
      }

      function rerenderAgent() {
        const analysisOpen = document.querySelector(".analysis-drawer")?.open;
        latestAnalysis = resumeAgentSession.analysis;
        renderWorkspace();
        if (analysisOpen) document.querySelector(".analysis-drawer").open = true;
      }

      async function submitFactCorrection(trigger) {
        const requirementId = document.querySelector("#correction-requirement")?.value;
        const answer = document.querySelector("#correction-answer")?.value.trim();
        const answerType = document.querySelector("#correction-type")?.value || "details";
        if (!requirementId || (!answer && answerType === "details")) {
          showAgentNotice("请选择要更正的项目并填写完整事实。", "warn");
          return;
        }
        await withBusy(trigger, "确认中...", async () => {
          const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/messages`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({content: "用户更正了简历事实。", answers: [
              {question_id: "", requirement_id: requirementId, answer: answer || "", answer_type: answerType}
            ]}),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(apiErrorMessage(payload, "更新失败"));
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      function showAgentNotice(message, tone = "warn") {
        const notice = document.querySelector("#agent-notice");
        if (!notice) return;
        notice.className = `workspace-notice show${tone === "danger" ? " danger" : ""}`;
        notice.textContent = message;
      }

      function agentSection() {
        const overview = latestAnalysis?.analysis_overview || {};
        const session = resumeAgentSession;
        if (!session) return "";
        const stateLabel = stateText(session.state);
        const questionCount = session?.pending_questions?.length || 0;
        const proposalCount = session?.proposals?.length || 0;
        const acceptedCount = (session?.proposals || []).filter((item) => item.status === "accepted").length;

        return `
          <section id="resume-agent-panel" class="agent-workbench">
            <div class="workspace-topbar">
              <div class="workspace-title">
                <div class="workspace-title-copy">
                  <strong>简历优化</strong>
                </div>
              </div>
              <div class="workspace-top-actions">
                <span class="chip strong">${escapeHtml(stateLabel)}</span>
                <button type="button" class="button-ghost" data-agent-action="new-session">重新分析</button>
              </div>
            </div>
            <div class="workspace-grid">
              ${agentWorkspace(session, questionCount, proposalCount, acceptedCount)}
            </div>
          </section>
        `;
      }

      function agentWorkspace(session, questionCount, proposalCount, acceptedCount) {
        return `
          ${workspaceRail(session, questionCount, proposalCount, acceptedCount)}
          <section class="workspace-pane conversation-pane">
            <div class="pane-head">
              <div>
                <h3>${questionCount ? "待补充信息" : "本轮信息已处理"}</h3>
              </div>
              <span class="chip ${questionCount ? "warn" : "strong"}">${questionCount ? `${questionCount} 项` : "已完成"}</span>
            </div>
            <div id="agent-notice" class="workspace-notice"></div>
            <p class="muted small">${escapeHtml(session.summary || "")}</p>
            ${questionPanel(session.pending_questions || [])}
            ${factCorrectionPanel(session)}
            ${messagePanel(session.messages || [])}
          </section>
          <section class="workspace-pane proposals-pane">
            <div class="pane-head">
              <div>
                <h3>候选改写</h3>
              </div>
              <span class="chip strong">${proposalCount} 条</span>
            </div>
            ${questionCount ? '<div class="empty"><strong>确认关键事实后生成改写</strong><p>没有做过或暂不回答的项目会保留为缺口。</p></div>' : proposalPanel(session.proposals || [])}
          </section>
        `;
      }

      function workspaceRail(session, questionCount, proposalCount, acceptedCount) {
        const score = latestAnalysis?.match_score || 0;
        const overview = latestAnalysis?.analysis_overview || {};
        const clarificationState = questionCount ? "active" : "done";
        const proposalState = questionCount ? "" : session.state === "completed" ? "done" : "active";
        return `
          <aside class="workspace-rail">
            <h2>进度</h2>

            <div class="rail-progress">
              ${railStep("01", "材料分析", "已完成", "done")}
              ${railStep("02", "补充信息", questionCount ? `${questionCount} 项` : "已完成", clarificationState)}
              ${railStep("03", "确认改写", proposalCount ? `${proposalCount} 条` : "暂无", proposalState)}
            </div>

            <div class="rail-score">
              <div><span>${session.facts?.length ? "补充后匹配度" : "初步匹配度"}</span></div>
              <div class="rail-score-value">${score}</div>
            </div>
            <div class="rail-kpis">
              ${railKpi("强匹配", overview.strong_match_count || 0)}
              ${railKpi("待回答", questionCount)}
              ${railKpi("已采纳", acceptedCount)}
            </div>

            <div class="rail-actions">
              <button type="button" data-agent-action="analysis">匹配详情</button>
              <button type="button" data-agent-action="document-view">简历版本与导出</button>
              <button type="button" data-agent-action="interview-view">面试练习</button>
            </div>
          </aside>
        `;
      }

      function railStep(index, title, detail, state = "") {
        return `
          <div class="rail-step ${state}">
            <span class="rail-step-index">${state === "done" ? "✓" : index}</span>
            <div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(detail)}</span></div>
          </div>
        `;
      }

      function railKpi(label, value) {
        return `<div class="rail-kpi"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function questionPanel(questions) {
        const content = questions.length
          ? questions
              .map((question) => `
                <div class="question-card">
                  <div class="question-head">
                    <strong>${escapeHtml(requirementLabel(question))}</strong>
                  </div>
                  <p>${escapeHtml(question.question)}</p>
                  ${question.expected_evidence?.length ? `<div class="pill-list">${question.expected_evidence.map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join("")}</div>` : ""}
                  <select aria-label="${escapeHtml(requirementLabel(question))} 的实际情况" data-answer-type="${escapeHtml(question.id)}">
                    <option value="details">补充实际经历</option>
                    <option value="no_experience">没有做过</option>
                    <option value="unsure">不确定，需要继续确认</option>
                    <option value="skip">暂不回答，保留缺口</option>
                  </select>
                  <textarea aria-label="${escapeHtml(requirementLabel(question))} 的补充说明" class="question-answer" data-question-id="${escapeHtml(question.id)}" placeholder="填写完整事实：具体场景、你完成的动作；有实际结果也可以补充"></textarea>
                </div>
              `)
              .join("")
          : '<div class="empty"><strong>暂无待补充项</strong></div>';
        return `
          <div class="question-stack">${content}</div>
          ${questions.length ? '<div class="conversation-submit"><button type="button" data-agent-action="answer">提交本轮补充</button></div>' : ""}
        `;
      }

      function factCorrectionPanel(session) {
        const requirements = session.review_items || [];
        if (!requirements.length) return "";
        return `<details class="dialogue-history">
          <summary>补充或更正已确认事实</summary>
          <p class="muted small">填写这一项的完整最新事实。内容变化后，相关改写需要重新确认。</p>
          <label for="correction-requirement">要更正的项目</label>
          <select id="correction-requirement">${requirements.map((item) => `<option value="${escapeHtml(item.requirement_id)}">${escapeHtml(requirementLabel(item))}</option>`).join("")}</select>
          <label for="correction-type">实际情况</label>
          <select id="correction-type"><option value="details">补充实际经历</option><option value="no_experience">没有做过</option><option value="unsure">不确定</option><option value="skip">暂不回答</option></select>
          <label for="correction-answer">完整最新事实</label>
          <textarea id="correction-answer" placeholder="具体场景、个人动作和实际结果"></textarea>
          <button type="button" data-agent-action="correct-fact">提交更正</button>
        </details>`;
      }

      function proposalPanel(proposals) {
        const content = proposals.length
          ? proposals.map(proposalCard).join("")
          : '<div class="empty"><strong>本轮没有可写入的新增经历</strong><p>缺口已保留，可以补充真实事实后重新生成。</p></div>';
        return `<div class="proposal-stack">${content}</div>`;
      }

      function requirementLabel(item) {
        const categories = {skill: "技能", project: "项目", experience: "经验", education: "学历", soft: "协作"};
        return `${item.requirement} · ${categories[item.category] || item.category || "要求"}`;
      }

      function proposalCard(item) {
        const toneClass = item.tone === "strong" ? "strong" : item.tone === "conservative" ? "warn" : "";
        const acceptedClass = item.status === "accepted" ? " accepted" : "";
        const safetyNotes = (item.safety_notes || [])
          .filter((note) => !/最终采用前|用户确认事实准确|不会直接覆盖|不得编造/.test(note))
          .map((note) => note.replace(/^仍需留意[：:]\s*/, "需补充："));
        return `
          <article class="proposal-card${acceptedClass}" data-proposal-id="${escapeHtml(item.id)}" data-proposal-version="${item.version || 1}">
            <div class="proposal-head">
              <strong>${escapeHtml(requirementLabel(item))}</strong>
              <span class="chip">第 ${item.version || 1} 版 · ${item.status === "accepted" ? "已采纳" : item.status === "rejected" ? "未采纳" : "待确认"}</span>
              <span class="chip ${toneClass}">${escapeHtml(toneText(item.tone))}</span>
            </div>
            <div class="proposal-copy">
              <div class="copy-block"><strong>原始依据</strong><span>${escapeHtml(item.before || item.evidence_basis || "-")}</span></div>
              <div class="copy-block"><strong>候选表达</strong><span>${escapeHtml(item.after || "-")}</span></div>
            </div>
            ${safetyNotes.length ? `<div class="pill-list">${safetyNotes.map((note) => `<span class="chip warn">${escapeHtml(note)}</span>`).join("")}</div>` : ""}
            <div class="proposal-actions">
              <button type="button" data-agent-action="accept" ${item.status === "accepted" ? "disabled" : ""}>采纳</button>
              <button type="button" class="button-secondary" data-agent-action="reject" ${item.status === "rejected" ? "disabled" : ""}>暂不采纳</button>
            </div>
          </article>
        `;
      }

      function messagePanel(messages) {
        const visible = messages.slice(-5);
        const content = visible.length
          ? visible
              .map((message) => `<div class="message ${message.role === "user" ? "user" : ""}">${escapeHtml(message.content)}</div>`)
              .join("")
          : '<p class="muted small">暂无记录</p>';
        return `<details class="dialogue-history"><summary>记录 · ${messages.length}</summary><div class="message-list">${content}</div></details>`;
      }

      function documentPanel(session) {
        const doc = session.document;
        if (!doc) return "";
        const text = (doc.fields || []).map(field => field.text).join("");
        const preview = session.preview;
        const selected = (session.proposals || []).filter(p => p.status === "accepted").length;
        return `<section id="document-panel" class="section-card wide" style="margin-top:18px">
          <h3>简历版本 · 第 ${doc.revision} 版</h3>
          <div id="document-notice" class="workspace-notice" role="status"></div>
          <p class="muted small">采纳候选后先检查字段差异，再确认应用。导出内容来自当前已保存版本。</p>
          ${doc.outdated_requirements?.length ? '<p class="chip warn">部分已应用表达的事实依据已更正，请更新或手动核对后导出。</p>' : ""}
          <div class="proposal-actions">
            <button type="button" data-agent-action="document-preview" ${!selected || session.pending_questions?.length ? "disabled" : ""}>预览已采纳改写（${selected}）</button>
            <button type="button" class="button-secondary" data-agent-action="document-export" ${doc.outdated_requirements?.length ? "disabled" : ""}>导出当前简历 TXT</button>
          </div>
          ${preview ? `<div id="document-preview" class="proposal-stack" style="margin-top:14px">
            <h3>待确认预览 · 基于第 ${preview.base_revision} 版</h3>
            ${preview.changes.map(change => `<article class="proposal-card">
              <strong>${change.operation === "add" ? "追加已确认事实" : "替换原文字段"}</strong>
              <p class="muted small">修改位置：${escapeHtml(change.label || "简历段落")}</p>
              <div class="proposal-copy"><div class="copy-block"><strong>修改前</strong><span style="white-space:pre-wrap">${escapeHtml(change.before || "（新增字段）")}</span></div>
              <div class="copy-block"><strong>修改后</strong><span style="white-space:pre-wrap">${escapeHtml(change.after)}</span></div></div>
              <p class="small">事实来源：${change.source_ids.map(id => id.startsWith("fact_") ? "已确认的用户补充" : "原始简历").join("、")}</p>
              ${change.evidence_basis.map(quote => `<p class="muted small">${escapeHtml(quote)}</p>`).join("")}
              <div class="pill-list">${change.checks.map(check => `<span class="chip strong">${escapeHtml(check)}</span>`).join("")}</div>
            </article>`).join("")}
            <details><summary>查看修改后的完整文本</summary><pre style="white-space:pre-wrap;padding:16px">${escapeHtml(preview.text)}</pre></details>
            <button type="button" data-agent-action="document-apply" data-preview-token="${escapeHtml(preview.token)}" data-document-revision="${preview.base_revision}">确认应用此预览</button>
          </div>` : ""}
          <details style="margin-top:14px"><summary>查看与手动编辑当前简历</summary>
            <div style="padding:16px"><label for="document-editor">当前简历文本</label>
            <textarea id="document-editor" rows="12" style="min-height:260px">${escapeHtml(text)}</textarea>
            <p class="muted small">手动编辑作为你确认的内容保存，匹配报告仍基于原始材料及补充事实。</p>
            <button type="button" data-agent-action="document-edit" data-document-revision="${doc.revision}">保存为新版本</button></div>
          </details>
          <details style="margin-top:12px"><summary>版本历史 · ${doc.versions.length} 个快照</summary>
            <div class="detail-list" style="padding:16px">${[...doc.versions].reverse().map(v => `<div class="detail-item">
              <strong>第 ${v.revision} 版 · ${escapeHtml(v.label)}</strong>
              <details><summary>查看文本</summary><pre style="white-space:pre-wrap;padding:12px">${escapeHtml(v.fields.map(f => f.text).join(""))}</pre></details>
              <button type="button" class="button-secondary" data-agent-action="document-restore" data-version-revision="${v.revision}" data-document-revision="${doc.revision}">恢复此版本</button>
            </div>`).join("")}</div>
          </details>
        </section>`;
      }

      async function sessionMutation(path, body, method = "POST") {
        const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/${path}`, {
          method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(apiErrorMessage(payload, "操作失败"));
        resumeAgentSession = payload;
        rerenderAgent();
      }

      async function documentAction(trigger, action) {
        await withBusy(trigger, "处理中...", async () => {
          const expected_revision = Number(trigger.dataset.documentRevision);
          if (action === "document-preview") await sessionMutation("document/preview", {});
          if (action === "document-apply") await sessionMutation("document/apply", {token: trigger.dataset.previewToken, expected_revision});
          if (action === "document-edit") await sessionMutation("document", {text: document.querySelector("#document-editor").value, expected_revision}, "PUT");
          if (action === "document-restore") await sessionMutation("document/restore", {revision: Number(trigger.dataset.versionRevision), expected_revision});
          if (action === "document-export") {
            const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/document/export`);
            if (!response.ok) throw new Error(apiErrorMessage(await response.json(), "导出失败"));
            const link = document.createElement("a");
            link.href = `/resume-agent/sessions/${resumeAgentSession.id}/document/export`;
            link.download = "jobfit-resume.txt";
            document.body.appendChild(link);
            link.click();
            link.remove();
          }
          if (action !== "document-export") document.querySelector("#document-panel")?.scrollIntoView({block: "start"});
        });
      }

      function currentInterview(session) {
        return (session.interviews || []).find(run => run.id === session.active_interview_id);
      }

      function feedbackCard(turn) {
        const feedback = turn.feedback;
        return `<div class="detail-item"><strong>${escapeHtml(turn.question.text)}</strong>
          <p style="white-space:pre-wrap">${escapeHtml(turn.skipped ? "已跳过" : turn.answer)}</p>
          <p class="muted small">${feedback.score == null ? "本次未评分" : `参考评分：${feedback.score}/100`}</p>
          ${feedback.evidence.map(quote => `<p class="small">回答依据：${escapeHtml(quote)}</p>`).join("")}
          ${feedback.strengths.map(item => `<p>${escapeHtml(item)}</p>`).join("")}
          ${feedback.improvements.map(item => `<p class="muted small">建议：${escapeHtml(item)}</p>`).join("")}
        </div>`;
      }

      function practiceReport(report) {
        if (!report) return "";
        return `<div class="detail-item"><h3>练习报告</h3><p>${escapeHtml(report.summary)}</p>
          <p>参考均分：${report.average_score ?? "暂无"} · 有效评价 ${report.assessed_count} 次</p>
          ${report.improvements.map(item => `<p>${escapeHtml(item)}</p>`).join("")}</div>`;
      }

      function interviewPanel(session) {
        const run = currentInterview(session);
        const question = run?.current_question;
        return `<section id="interview-panel" class="section-card wide" style="margin-top:18px">
          <h3>面试练习</h3><p class="muted small">优先练习岗位缺口；回答与反馈独立保存，不自动成为简历事实。</p>
          <div id="interview-notice" class="workspace-notice" role="status"></div>
          ${!run || run.state === "completed" ? '<button type="button" data-agent-action="interview-start">开始新一轮练习（最多 3 题）</button>' : ""}
          ${run ? `<p class="chip">${run.state === "paused" ? "已暂停" : run.state === "completed" ? "已结束" : "进行中"} · 使用简历第 ${run.source_document_revision} 版</p>
            ${question ? `<div class="question-card"><strong>第 ${run.position + 1}/${run.plan.length} 题${question.kind === "followup" ? " · 追问" : ""}</strong>
              <p>${escapeHtml(question.text)}</p><p class="muted small">考察重点：${escapeHtml(question.focus)}</p>
              ${run.state === "active" ? `<label for="interview-answer">你的回答</label><textarea id="interview-answer" placeholder="说明思路和真实范围"></textarea>
              <div class="proposal-actions"><button type="button" data-agent-action="interview-answer">提交回答</button><button type="button" class="button-secondary" data-agent-action="interview-skip">跳过本题</button></div>` : ""}</div>` : ""}
            ${run.state !== "completed" ? `<div class="proposal-actions"><button type="button" class="button-secondary" data-agent-action="interview-${run.state === "paused" ? "resume" : "pause"}">${run.state === "paused" ? "继续练习" : "暂停练习"}</button>
            <button type="button" class="button-secondary" data-agent-action="interview-finish">结束并生成报告</button></div>` : ""}
            ${practiceReport(run.report)}
            ${run.turns.length ? `<details style="margin-top:12px" open><summary>本轮回答与反馈 · ${run.turns.length} 次</summary><div class="detail-list" style="padding:16px">${run.turns.map(feedbackCard).join("")}</div></details>` : ""}` : ""}
          ${(session.interviews || []).length > 1 ? `<details style="margin-top:12px"><summary>历史练习</summary>${session.interviews.filter(item => item.id !== run?.id).map(item => `<div style="padding:16px">${practiceReport(item.report)}${item.turns.map(feedbackCard).join("")}</div>`).join("")}</details>` : ""}
        </section>`;
      }

      async function interviewAction(trigger, action) {
        const run = currentInterview(resumeAgentSession);
        await withBusy(trigger, "处理中...", async () => {
          if (action === "interview-start") {
            await sessionMutation("interview", {question_count: 3});
          } else {
            const guard = {run_id: run.id, expected_revision: run.revision};
            if (action === "interview-answer" || action === "interview-skip") {
              await sessionMutation("interview/answers", {...guard, question_id: run.current_question.id,
                answer: document.querySelector("#interview-answer")?.value || "", skip: action === "interview-skip"});
            } else await sessionMutation("interview/control", {...guard, action: action.replace("interview-", "")});
          }
          document.querySelector("#interview-panel")?.scrollIntoView({block: "start"});
        });
      }

      function stateText(state) {
        const map = {
          intake: "准备",
          reviewing: "分析中",
          needs_clarification: "待补充",
          proposal_ready: "待确认",
          awaiting_user_choice: "待确认",
          completed: "已完成",
        };
        return map[state] || state || "未知";
      }

      function toneText(tone) {
        const map = {
          conservative: "保守表达",
          balanced: "平衡表达",
          strong: "强化表达",
        };
        return map[tone] || tone || "候选";
      }

      function metric(label, value) {
        return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function pillSection(title, items, tone = "") {
        const content = items.length
          ? items.map((item) => `<span class="pill ${tone}">${escapeHtml(item)}</span>`).join("")
          : '<span class="muted small">暂无</span>';
        return `<section class="section-card"><h3>${title}</h3><div class="pill-list">${content}</div></section>`;
      }

      function matchDetailSection(items) {
        const rows = items.map((item) => {
          const pct = typeof item.score === "number" ? item.score : 0;
          return `<tr><td>${escapeHtml(item.requirement)}</td><td>${pct}%</td><td>${escapeHtml(item.resume_evidence || "-")}</td></tr>`;
        });
        return `
          <section class="section-card wide">
            <h3>匹配详情</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>要求</th><th>匹配度</th><th>简历证据</th></tr></thead>
                <tbody>${rows.join("") || '<tr><td colspan="3" class="muted">暂无匹配详情</td></tr>'}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      function listSection(title, items, wide = false) {
        const content = items.length
          ? items
              .map((item) => `
                <li class="detail-item">
                  <span class="detail-title">${escapeHtml(item.title)}</span>
                  ${item.body ? `<span>${escapeHtml(item.body)}</span>` : ""}
                  ${item.meta ? `<div class="detail-meta">${escapeHtml(item.meta)}</div>` : ""}
                </li>
              `)
              .join("")
          : '<li class="detail-item muted">暂无明显结果</li>';
        return `<section class="section-card ${wide ? "wide" : ""}"><h3>${title}</h3><ul class="detail-list">${content}</ul></section>`;
      }

      function splitDetail(value) {
        const text = String(value);
        const index = text.indexOf(":");
        if (index === -1) {
          return { title: text, body: "", meta: "" };
        }
        return { title: text.slice(0, index), body: text.slice(index + 1).trim(), meta: "" };
      }

      function scorePart(value, total) {
        return `${Number.isFinite(Number(value)) ? value : 0}/${Number.isFinite(Number(total)) ? total : 0}`;
      }

      function numberPart(value) {
        return Number.isFinite(Number(value)) ? Number(value).toFixed(2) : "0.00";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return String(value).replace(/["\\]/g, "\\$&");
      }
      restoreSession();
    </script>
  </body>
</html>
