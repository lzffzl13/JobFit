<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobFit Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 17.5 14 22l9-12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --panel: #ffffff;
        --text: #162021;
        --muted: #647172;
        --line: #dce5e3;
        --accent: #0f766e;
        --accent-dark: #0b5f58;
        --accent-soft: #e8f5f3;
        --ink: #243735;
        --blue: #245a8d;
        --blue-soft: #eaf3fb;
        --gold: #8b6a15;
        --gold-soft: #fbf4dc;
        --warn: #a15c07;
        --warn-soft: #fff5df;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --soft: #f3f7f6;
        --shadow: 0 14px 34px rgba(22, 32, 33, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .wrap {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
      }

      header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 66px;
        gap: 16px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 23px;
        line-height: 1.2;
      }

      h2 {
        font-size: 18px;
        line-height: 1.3;
      }

      h3 {
        font-size: 15px;
        line-height: 1.35;
      }

      p,
      li {
        line-height: 1.55;
      }

      main {
        padding: 22px 0 42px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .input-panel {
        padding: 18px;
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 13px;
      }

      .input-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        background: #fcfefd;
        color: var(--text);
        font: inherit;
      }

      textarea {
        min-height: 280px;
        resize: vertical;
        line-height: 1.55;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
      }

      .form-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: end;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .upload-box {
        display: grid;
        gap: 8px;
      }

      button {
        min-width: 168px;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .button-secondary {
        min-width: 120px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #fcfefd;
      }

      .button-secondary:hover {
        background: var(--soft);
      }

      .button-ghost {
        min-width: auto;
        border: 1px solid transparent;
        color: var(--accent);
        background: transparent;
        padding: 8px 10px;
      }

      .button-ghost:hover {
        border-color: var(--line);
        background: var(--accent-soft);
      }

      .report {
        margin-top: 20px;
      }

      .empty {
        padding: 20px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .report-shell {
        display: grid;
        gap: 16px;
      }

      .summary-band {
        display: grid;
        grid-template-columns: minmax(180px, 0.65fr) minmax(0, 2.35fr);
        gap: 16px;
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .score-box {
        display: grid;
        align-content: center;
        min-height: 150px;
        padding: 16px;
        border-radius: 8px;
        background: var(--accent-soft);
        border: 1px solid #c9e8e3;
      }

      .score-box span {
        color: var(--muted);
        font-weight: 750;
      }

      .score {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 8px;
      }

      .score strong {
        font-size: 52px;
        line-height: 1;
      }

      .summary-copy {
        display: grid;
        gap: 14px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .metric span {
        display: block;
        min-height: 34px;
        color: var(--muted);
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }

      .section-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .section-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .section-card.wide {
        grid-column: 1 / -1;
      }

      .agent-card {
        grid-column: 1 / -1;
        display: grid;
        gap: 14px;
        padding: 0;
        overflow: hidden;
        border-color: #c9e8e3;
      }

      .agent-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(240px, 0.55fr);
        gap: 16px;
        align-items: center;
        padding: 16px;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(36, 90, 141, 0.08)),
          #fcfefd;
        border-bottom: 1px solid var(--line);
      }

      .agent-title {
        display: grid;
        gap: 7px;
      }

      .agent-title h3 {
        font-size: 17px;
      }

      .agent-status {
        justify-self: end;
        display: grid;
        gap: 8px;
        min-width: 220px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
      }

      .status-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }

      .agent-body {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .agent-layout {
        display: grid;
        grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.35fr);
        gap: 14px;
      }

      .agent-column {
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .agent-subpanel {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fcfefd;
      }

      .agent-subpanel h4 {
        margin: 0;
        font-size: 14px;
      }

      .agent-kpis {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .agent-kpi {
        min-height: 66px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .agent-kpi span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .agent-kpi strong {
        display: block;
        margin-top: 6px;
        font-size: 20px;
      }

      .question-card,
      .proposal-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .question-card {
        border-left: 4px solid var(--gold);
      }

      .proposal-card {
        border-left: 4px solid var(--accent);
      }

      .proposal-card.accepted {
        border-left-color: var(--blue);
        background: var(--blue-soft);
      }

      .question-head,
      .proposal-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-height: 24px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .chip.strong {
        border-color: #b8dfd8;
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .chip.warn {
        border-color: #efd28f;
        background: var(--gold-soft);
        color: var(--gold);
      }

      .chip.danger {
        border-color: #f6c5c0;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .proposal-copy {
        display: grid;
        gap: 8px;
      }

      .copy-block {
        display: grid;
        gap: 5px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
      }

      .copy-block strong {
        color: var(--muted);
        font-size: 12px;
      }

      .agent-actions,
      .proposal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .question-answer {
        min-height: 92px;
      }

      .message-list {
        display: grid;
        gap: 8px;
        max-height: 250px;
        overflow: auto;
      }

      .message {
        padding: 9px 10px;
        border-radius: 7px;
        background: var(--soft);
        font-size: 13px;
      }

      .message.user {
        background: var(--accent-soft);
      }

      .section-card h3 {
        margin-bottom: 10px;
      }

      .pill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        max-width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fcfefd;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-word;
      }

      .pill.warn {
        border-color: #f0d098;
        background: var(--warn-soft);
        color: var(--warn);
      }

      .pill.danger {
        border-color: #f6c5c0;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .detail-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .detail-item {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fcfefd;
        word-break: break-word;
      }

      .detail-title {
        display: block;
        margin-bottom: 5px;
        font-weight: 700;
      }

      .detail-meta {
        color: var(--muted);
        font-size: 13px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        background: #fcfefd;
      }

      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 14px;
        line-height: 1.45;
      }

      th {
        color: var(--muted);
        background: var(--soft);
        font-weight: 750;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      summary {
        cursor: pointer;
        padding: 14px 16px;
        font-weight: 750;
      }

      .evidence {
        max-height: 320px;
        overflow: auto;
        display: grid;
        gap: 8px;
        padding: 0 16px 16px;
      }

      .quote {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px;
        background: #fcfefd;
      }

      .tag {
        display: inline-block;
        margin-bottom: 6px;
        color: var(--warn);
        font-size: 12px;
        font-weight: 750;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 980px) {
        .summary-band,
        .agent-hero,
        .agent-layout,
        .section-grid,
        .input-grid {
          grid-template-columns: 1fr;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-actions {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }

        .agent-status {
          justify-self: stretch;
        }
      }

      @media (max-width: 620px) {
        .wrap {
          width: min(100vw - 20px, 1180px);
        }

        header .wrap,
        .panel-head {
          flex-direction: column;
          align-items: flex-start;
        }

        main {
          padding-top: 14px;
        }

        .input-panel,
        .summary-band,
        .section-card {
          padding: 14px;
        }

        .metrics {
          grid-template-columns: 1fr;
        }

        .score strong {
          font-size: 44px;
        }

        table {
          min-width: 0;
        }

        th,
        td {
          padding: 9px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="brand">
          <span class="eyebrow">Resume x JD</span>
          <h1>JobFit Agent</h1>
        </div>
        <span class="muted small">AI extraction + deterministic matching</span>
      </div>
    </header>
    <main class="wrap">
      <section class="panel input-panel">
        <div class="panel-head">
          <div>
            <h2>匹配分析</h2>
            <p class="muted small">粘贴简历和 JD 后生成完整分析报告。</p>
          </div>
        </div>
        <form id="form">
          <div class="input-grid">
            <div class="field">
              <label for="resume-text">简历文本</label>
              <textarea
                id="resume-text"
                name="resume_text"
                placeholder="粘贴你的简历正文。项目经历、技能栈、实习经历都可以直接放进来。"
              ></textarea>
            </div>
            <div class="field">
              <label for="jd">岗位 JD</label>
              <textarea
                id="jd"
                name="jd"
                required
                placeholder="粘贴后端、AI 应用、LLM 应用或其他实习岗位 JD。"
              ></textarea>
            </div>
          </div>
          <div class="form-actions">
            <div class="upload-box">
              <label for="resume">简历文件</label>
              <input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt,.md" />
              <span class="muted small">文本和文件同时提供时，优先使用文本。</span>
            </div>
            <button id="submit" type="submit">开始分析</button>
          </div>
        </form>
      </section>

      <section class="report" aria-live="polite">
        <div id="result" class="empty muted">分析结果会显示在这里。</div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#form");
      const button = document.querySelector("#submit");
      const result = document.querySelector("#result");
      const resumeText = document.querySelector("#resume-text");
      const resumeFile = document.querySelector("#resume");
      const jdText = document.querySelector("#jd");
      let latestAnalysis = null;
      let resumeAgentSession = null;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!resumeText.value.trim() && !resumeFile.files[0]) {
          result.className = "empty";
          result.innerHTML = `<span class="tag">ERROR</span><p>请粘贴简历文本，或者上传一个简历文件。</p>`;
          return;
        }

        const data = new FormData();
        if (resumeText.value.trim()) {
          data.append("resume_text", resumeText.value);
        }
        if (resumeFile.files[0]) {
          data.append("resume", resumeFile.files[0]);
        }
        data.append("jd_text", jdText.value);

        button.disabled = true;
        button.textContent = "分析中...";
        result.className = "empty muted";
        result.textContent = "正在提取简历信息、分析 JD 要求并计算匹配度...";

        try {
          const response = await fetch("/jobfit/analyze", { method: "POST", body: data });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "请求失败");
          }
          latestAnalysis = payload;
          resumeAgentSession = null;
          render(payload);
          result.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (error) {
          result.className = "empty";
          result.innerHTML = `<span class="tag">ERROR</span><p>${escapeHtml(error.message)}</p>`;
        } finally {
          button.disabled = false;
          button.textContent = "开始分析";
        }
      });

      result.addEventListener("click", async (event) => {
        const action = event.target.closest("[data-agent-action]")?.dataset.agentAction;
        if (!action) return;

        if (action === "start") {
          await startResumeAgent(event.target);
        }
        if (action === "answer") {
          await submitAgentAnswers(event.target);
        }
        if (action === "accept" || action === "reject") {
          await submitProposalDecision(event.target, action);
        }
      });

      function render(data) {
        const breakdown = data.score_breakdown || {};
        result.className = "report-shell";
        result.innerHTML = `
          <div class="summary-band">
            <div class="score-box">
              <span>匹配度</span>
              <div class="score"><strong>${data.match_score}</strong><span class="muted">/ 100</span></div>
              <p class="small muted">程序计算 · ${escapeHtml(data.model_used)}</p>
            </div>
            <div class="summary-copy">
              <div>
                <h2>分析结果</h2>
                <p class="muted">${escapeHtml(data.summary)}</p>
              </div>
              <div class="metrics">
                ${metric("技能匹配", `${breakdown.skill_score || 0}`)}
                ${metric("经验匹配", `${breakdown.experience_score || 0}`)}
                ${metric("项目匹配", `${breakdown.project_score || 0}`)}
                ${metric("学历匹配", `${breakdown.education_score || 0}`)}
                ${metric("模型", escapeHtml(data.model_used))}
              </div>
              ${data.fallback_used ? '<span class="pill warn">当前未调用 DeepSeek，返回本地规则结果</span>' : ""}
            </div>
          </div>

          <div class="section-grid">
            ${agentSection()}
            ${pillSection("待补强", data.risk_items || [], "warn")}
            ${matchDetailSection(data.matched_strengths || [])}
            ${listSection("待补强建议", (data.gaps || []).map((x) => ({ title: x.requirement, body: x.suggestion, meta: "" })))}
            ${listSection("简历优化建议", (data.resume_rewrites || []).map((x) => ({ title: x.after, body: x.reason, meta: x.before })), true)}
            ${listSection("面试问题", (data.interview_questions || []).map((x) => ({ title: x.question, body: x.focus, meta: x.difficulty })))}
          </div>
        `;
      }

      async function startResumeAgent(trigger) {
        if (!resumeText.value.trim()) {
          showAgentNotice("当前前端 Agent 会话需要简历文本。请把简历内容粘贴到左侧文本框后再启动。", "danger");
          return;
        }
        if (!jdText.value.trim()) {
          showAgentNotice("请先提供岗位 JD。", "danger");
          return;
        }

        await withBusy(trigger, "启动中...", async () => {
          const response = await fetch("/resume-agent/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              resume_text: resumeText.value.trim(),
              jd_text: jdText.value.trim(),
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "Resume Agent 启动失败");
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      async function submitAgentAnswers(trigger) {
        if (!resumeAgentSession) return;

        const answers = resumeAgentSession.pending_questions
          .map((question) => {
            const textarea = document.querySelector(`[data-question-id="${cssEscape(question.id)}"]`);
            return {
              question_id: question.id,
              requirement: question.requirement,
              answer: textarea?.value.trim() || "",
            };
          })
          .filter((item) => item.answer);

        if (!answers.length) {
          showAgentNotice("先回答至少一个问题，我再帮你更新建议。", "warn");
          return;
        }

        await withBusy(trigger, "更新中...", async () => {
          const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/messages`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: "用户补充了简历事实。", answers }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "更新失败");
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      async function submitProposalDecision(trigger, action) {
        if (!resumeAgentSession) return;
        const proposalId = trigger.closest("[data-proposal-id]")?.dataset.proposalId;
        if (!proposalId) return;

        await withBusy(trigger, action === "accept" ? "采纳中..." : "记录中...", async () => {
          const response = await fetch(`/resume-agent/sessions/${resumeAgentSession.id}/decisions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              proposal_id: proposalId,
              decision: action === "accept" ? "accepted" : "rejected",
              note: action === "accept" ? "采纳该候选建议。" : "暂不采纳该候选建议。",
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "记录选择失败");
          resumeAgentSession = payload;
          rerenderAgent();
        });
      }

      async function withBusy(buttonEl, label, work) {
        const original = buttonEl.textContent;
        buttonEl.disabled = true;
        buttonEl.textContent = label;
        try {
          await work();
        } catch (error) {
          showAgentNotice(error.message, "danger");
        } finally {
          buttonEl.disabled = false;
          buttonEl.textContent = original;
        }
      }

      function rerenderAgent() {
        const node = document.querySelector("#resume-agent-panel");
        if (node) node.outerHTML = agentSection();
      }

      function showAgentNotice(message, tone = "warn") {
        const notice = document.querySelector("#agent-notice");
        if (!notice) return;
        notice.className = `pill ${tone === "danger" ? "danger" : "warn"}`;
        notice.textContent = message;
      }

      function agentSection() {
        const overview = latestAnalysis?.analysis_overview || {};
        const session = resumeAgentSession;
        const stateLabel = session ? stateText(session.state) : "未启动";
        const questionCount = session?.pending_questions?.length || 0;
        const proposalCount = session?.proposals?.length || 0;
        const acceptedCount = (session?.proposals || []).filter((item) => item.status === "accepted").length;

        return `
          <section id="resume-agent-panel" class="section-card agent-card">
            <div class="agent-hero">
              <div class="agent-title">
                <span class="eyebrow">Resume Agent</span>
                <h3>把分析结果推进成可确认的简历优化建议</h3>
                <p class="muted small">${session ? escapeHtml(session.summary || "会话已创建。") : "Agent 会先审查证据，再追问缺失信息，最后给出可选择的候选表达。"}</p>
              </div>
              <div class="agent-status">
                <div class="status-line"><span class="muted">状态</span><span class="chip ${session ? "strong" : ""}">${escapeHtml(stateLabel)}</span></div>
                <div class="status-line"><span class="muted">强匹配</span><strong>${overview.strong_match_count || 0}</strong></div>
                <div class="status-line"><span class="muted">待补充</span><strong>${overview.gap_count || 0}</strong></div>
              </div>
            </div>
            <div class="agent-body">
              <div id="agent-notice" class="pill warn" style="display:${session ? "none" : "inline-flex"}">启动后会创建一次独立的优化会话。</div>
              ${session ? agentWorkspace(session, questionCount, proposalCount, acceptedCount) : agentStarter()}
            </div>
          </section>
        `;
      }

      function agentStarter() {
        return `
          <div class="agent-actions">
            <button type="button" data-agent-action="start">启动 Resume Agent</button>
            <span class="muted small">需要当前文本框里保留简历文本和 JD。</span>
          </div>
        `;
      }

      function agentWorkspace(session, questionCount, proposalCount, acceptedCount) {
        return `
          <div class="agent-kpis">
            ${agentKpi("待回答", questionCount)}
            ${agentKpi("候选建议", proposalCount)}
            ${agentKpi("已采纳", acceptedCount)}
          </div>
          <div class="agent-layout">
            <div class="agent-column">
              ${questionPanel(session.pending_questions || [])}
              ${messagePanel(session.messages || [])}
            </div>
            <div class="agent-column">
              ${proposalPanel(session.proposals || [])}
            </div>
          </div>
        `;
      }

      function agentKpi(label, value) {
        return `<div class="agent-kpi"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function questionPanel(questions) {
        const content = questions.length
          ? questions
              .map((question) => `
                <div class="question-card">
                  <div class="question-head">
                    <strong>${escapeHtml(question.requirement)}</strong>
                    <span class="chip warn">需要补充</span>
                  </div>
                  <p>${escapeHtml(question.question)}</p>
                  ${question.expected_evidence?.length ? `<div class="pill-list">${question.expected_evidence.map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join("")}</div>` : ""}
                  <textarea class="question-answer" data-question-id="${escapeHtml(question.id)}" placeholder="补充真实信息；如果没有做过，也可以直接说明没有。"></textarea>
                </div>
              `)
              .join("")
          : '<p class="muted small">暂时没有必须追问的问题。</p>';
        return `
          <div class="agent-subpanel">
            <h4>Agent 追问</h4>
            ${content}
            ${questions.length ? '<button type="button" data-agent-action="answer">提交补充信息</button>' : ""}
          </div>
        `;
      }

      function proposalPanel(proposals) {
        const content = proposals.length
          ? proposals.map(proposalCard).join("")
          : '<p class="muted small">回答追问后，这里会出现候选改写建议。</p>';
        return `<div class="agent-subpanel"><h4>候选改写</h4>${content}</div>`;
      }

      function proposalCard(item) {
        const toneClass = item.tone === "strong" ? "strong" : item.tone === "conservative" ? "warn" : "";
        const acceptedClass = item.status === "accepted" ? " accepted" : "";
        return `
          <article class="proposal-card${acceptedClass}" data-proposal-id="${escapeHtml(item.id)}">
            <div class="proposal-head">
              <strong>${escapeHtml(item.requirement)}</strong>
              <span class="chip ${toneClass}">${escapeHtml(toneText(item.tone))}</span>
            </div>
            <div class="proposal-copy">
              <div class="copy-block"><strong>原始依据</strong><span>${escapeHtml(item.before || item.evidence_basis || "-")}</span></div>
              <div class="copy-block"><strong>候选表达</strong><span>${escapeHtml(item.after || "-")}</span></div>
            </div>
            <p class="muted small">${escapeHtml(item.reason || "")}</p>
            ${item.safety_notes?.length ? `<div class="pill-list">${item.safety_notes.map((note) => `<span class="chip warn">${escapeHtml(note)}</span>`).join("")}</div>` : ""}
            <div class="proposal-actions">
              <button type="button" data-agent-action="accept" ${item.status === "accepted" ? "disabled" : ""}>采纳</button>
              <button type="button" class="button-secondary" data-agent-action="reject" ${item.status === "rejected" ? "disabled" : ""}>暂不采纳</button>
              <span class="muted small">置信度 ${Math.round((item.confidence || 0) * 100)}%</span>
            </div>
          </article>
        `;
      }

      function messagePanel(messages) {
        const visible = messages.slice(-5);
        const content = visible.length
          ? visible
              .map((message) => `<div class="message ${message.role === "user" ? "user" : ""}">${escapeHtml(message.content)}</div>`)
              .join("")
          : '<p class="muted small">会话消息会显示在这里。</p>';
        return `<div class="agent-subpanel"><h4>会话记录</h4><div class="message-list">${content}</div></div>`;
      }

      function stateText(state) {
        const map = {
          intake: "准备中",
          reviewing: "审查中",
          needs_clarification: "等待补充",
          proposal_ready: "可生成建议",
          awaiting_user_choice: "等待选择",
          completed: "已完成",
        };
        return map[state] || state || "未知";
      }

      function toneText(tone) {
        const map = {
          conservative: "保守表达",
          balanced: "平衡表达",
          strong: "强化表达",
        };
        return map[tone] || tone || "候选";
      }

      function metric(label, value) {
        return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function pillSection(title, items, tone = "") {
        const content = items.length
          ? items.map((item) => `<span class="pill ${tone}">${escapeHtml(item)}</span>`).join("")
          : '<span class="muted small">暂无</span>';
        return `<section class="section-card"><h3>${title}</h3><div class="pill-list">${content}</div></section>`;
      }

      function matchDetailSection(items) {
        const rows = items.map((item) => {
          const pct = typeof item.score === "number" ? item.score : 0;
          return `<tr><td>${escapeHtml(item.requirement)}</td><td>${pct}%</td><td>${escapeHtml(item.resume_evidence || "-")}</td></tr>`;
        });
        return `
          <section class="section-card wide">
            <h3>匹配详情</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>要求</th><th>匹配度</th><th>简历证据</th></tr></thead>
                <tbody>${rows.join("") || '<tr><td colspan="3" class="muted">暂无匹配详情</td></tr>'}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      function listSection(title, items, wide = false) {
        const content = items.length
          ? items
              .map((item) => `
                <li class="detail-item">
                  <span class="detail-title">${escapeHtml(item.title)}</span>
                  ${item.body ? `<span>${escapeHtml(item.body)}</span>` : ""}
                  ${item.meta ? `<div class="detail-meta">${escapeHtml(item.meta)}</div>` : ""}
                </li>
              `)
              .join("")
          : '<li class="detail-item muted">暂无明显结果</li>';
        return `<section class="section-card ${wide ? "wide" : ""}"><h3>${title}</h3><ul class="detail-list">${content}</ul></section>`;
      }

      function splitDetail(value) {
        const text = String(value);
        const index = text.indexOf(":");
        if (index === -1) {
          return { title: text, body: "", meta: "" };
        }
        return { title: text.slice(0, index), body: text.slice(index + 1).trim(), meta: "" };
      }

      function scorePart(value, total) {
        return `${Number.isFinite(Number(value)) ? value : 0}/${Number.isFinite(Number(total)) ? total : 0}`;
      }

      function numberPart(value) {
        return Number.isFinite(Number(value)) ? Number(value).toFixed(2) : "0.00";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return String(value).replace(/["\\]/g, "\\$&");
      }
    </script>
  </body>
</html>
